# Desktop idle timeouts (sourced by hypridle.conf through idle.conf):
# lock after 10 min, screens off after 15, never suspend.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
