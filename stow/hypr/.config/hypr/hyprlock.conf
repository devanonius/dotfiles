# hyprlock (hyprlang syntax). Colors come from the active theme
# ($bg $fg $accent $muted $red), written by pywal.
source = ~/.cache/wal/colors-hyprlock.conf
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    color = $bg
}

label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = $font
    color = $fg
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    check_color = $accent
    fail_color = $red
    placeholder_text = <span foreground="##565f89">Password</span>
    fade_on_empty = false
    rounding = 8
    position = 0, -40
    halign = center
    valign = center
}
