# hyprlock (hyprlang syntax). Tokyo Night colors until the theme engine
# (phase 3) provides them.
$font = JetBrainsMono Nerd Font
$bg = rgb(1a1b26)
$fg = rgb(c0caf5)
$accent = rgb(7aa2f7)
$muted = rgb(565f89)
$red = rgb(f7768e)

general {
    hide_cursor = true
}

background {
    monitor =
    color = $bg
}

label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = $font
    color = $fg
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    check_color = $accent
    fail_color = $red
    placeholder_text = <span foreground="##565f89">Password</span>
    fade_on_empty = false
    rounding = 8
    position = 0, -40
    halign = center
    valign = center
}
