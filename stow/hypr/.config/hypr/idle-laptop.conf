# Laptop idle timeouts (sourced by hypridle.conf through idle.conf):
# dim after 2.5 min, lock after 5, screen off after 5.5, suspend after 15.
# hypridle cannot tell battery from AC, so suspend applies to both.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
