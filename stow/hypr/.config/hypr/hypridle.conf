# hypridle (still hyprlang syntax, not Lua). The timeouts depend on the
# machine: idle.conf is a link the installer points at idle-laptop.conf or
# idle-desktop.conf (see lib/install/50-stow.sh).
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

source = ~/.config/hypr/idle.conf
